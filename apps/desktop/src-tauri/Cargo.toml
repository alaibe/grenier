[package]
name = "grenier-desktop"
description = "Grenier's desktop app: a window on the local daemon, which it runs as a sidecar"
version = "0.1.12"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "grenier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-opener = "=2.5.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.12.6", features = ["tray-icon", "image-png"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Tauri commands take their app, state and arguments by value.
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
