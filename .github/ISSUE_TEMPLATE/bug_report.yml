name: Report a problem
description: Something in Grenier does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Leave out your pages, prompts, keys, tokens and anything else you would not post openly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include any error message as it appeared, without private content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Routines
        2. Run a routine by hand
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Knowledge
        - Cost
        - Routines
        - Skills
        - MCP
        - Instructions
        - Team
        - Settings
        - The grenier command
        - An agent (Claude Code, Codex)
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in when you come from Grenier's Report a problem.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The system and its version.
      placeholder: macOS 26.1, Windows 11, Ubuntu 24.04
    validations:
      required: true
