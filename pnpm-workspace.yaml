packages:
  - packages/*
  - apps/*
  - bench

# 7 days, in minutes: a compromised release is usually caught and pulled within days.
saveExact: true
minimumReleaseAge: 10080

# better-sqlite3 ships N-API prebuilds for every platform, so its node-gyp build is skipped.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - better-sqlite3

# @esbuild-kit asks for esbuild 0.18 (GHSA-67mh-4wv8-2f99); it works with drizzle-kit's patched 0.25.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12

# No picomatch release fixes this yet; only vite and vitest use it, on our own globs. Remove once one does.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
