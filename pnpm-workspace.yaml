packages:
  - packages/*
  - apps/*

# Exact versions only, and nothing published less than 7 days ago (in minutes): a compromised release is usually
# caught and pulled within days.
saveExact: true
minimumReleaseAge: 10080

# Install scripts run only for these. esbuild's fetches its binary. better-sqlite3 ships N-API prebuilds for every
# platform, so its node-gyp build is skipped.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - better-sqlite3

# drizzle-kit loads its config through @esbuild-kit, which asks for esbuild 0.18 (GHSA-67mh-4wv8-2f99). It works with
# the patched 0.25 that drizzle-kit itself uses.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
