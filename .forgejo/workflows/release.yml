name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time per tag, never cancelled halfway through an upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASES_REPOSITORY: alaibe/grenier
  # gh talks to GitHub, not to the Forgejo the job runs for; the home runner's image has no gh of its own.
  GH_HOST: github.com
  GH_VERSION: 2.104.0
  GH_SHA256: 98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e

jobs:
  prepare:
    runs-on: home-linux
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Secrets are set
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: '[ -n "$RELEASES_TOKEN" ] || { echo "The RELEASES_TOKEN secret is not set." >&2; exit 1; }'

      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: gh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      - id: version
        name: Version files agree with the tag
        run: |
          V=$(node scripts/version.ts check)
          case "${{ github.ref }}" in
            refs/tags/*) [ "${{ github.ref_name }}" = "v$V" ] || { echo "tag ${{ github.ref_name }} does not match the version files' $V" >&2; exit 1; } ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # A copy released without the key's public half could never update itself.
      - name: The app carries the update key
        run: |
          node -e 'const c = require("./apps/desktop/src-tauri/tauri.conf.json"); process.exit(c.plugins?.updater?.pubkey ? 0 : 1)' ||
            { echo "plugins.updater.pubkey is empty in tauri.conf.json: ci-secrets.sh tauri-key grenier prints it" >&2; exit 1; }

      # A release whose tag GitHub lacks would be made from GitHub's main, then overwritten by the mirror.
      - name: GitHub has the tag, at this commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for attempt in $(seq 60); do
            ref=$(gh api "repos/$RELEASES_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null || true)
            if [ "${ref%% *}" = tag ]; then
              ref="commit $(gh api "repos/$RELEASES_REPOSITORY/git/tags/${ref#* }" --jq .object.sha)"
            fi
            [ "${ref#* }" = "$GITHUB_SHA" ] && { echo "GitHub has $TAG at $GITHUB_SHA."; exit 0; }
            sleep 10
          done
          echo "After ten minutes GitHub's $TAG is '${ref:-missing}', not $GITHUB_SHA: is the push mirror to GitHub working?" >&2
          exit 1

      - name: Release notes
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            git log --no-merges --format='- %s' "$PREVIOUS..HEAD" > "$RUNNER_TEMP/all-notes"
            COUNT=$(wc -l < "$RUNNER_TEMP/all-notes")
            head -n 50 "$RUNNER_TEMP/all-notes" > "$RUNNER_TEMP/notes"
            [ "$COUNT" -le 50 ] || echo "- And $((COUNT - 50)) more changes" >> "$RUNNER_TEMP/notes"
          else
            echo "The first release of Grenier." > "$RUNNER_TEMP/notes"
          fi
          cat "$RUNNER_TEMP/notes"

      - id: release
        name: Draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          # Looking a release up by tag never finds a draft.
          release=$(gh api "repos/$RELEASES_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -1)
          if [ -n "$release" ]; then
            [ "${release#* }" = true ] || { echo "Grenier $V is already published; this run would overwrite its files." >&2; exit 1; }
            id=${release%% *}
          else
            id=$(gh api "repos/$RELEASES_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Grenier $V" \
              -F body=@"$RUNNER_TEMP/notes" -F draft=true -F prerelease=false --jq .id)
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "no release id: $id" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: mac
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "The $name secret is not set." >&2; exit 1; }
          done

      # `rustup install` with no toolchain named installs rust-toolchain.toml's.
      - name: The Mac's tools
        run: |
          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          rustup install --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version
          # Whole outputs: `| head` would end a command early, and the pipe's SIGPIPE fails the step.
          xcodebuild -version; node --version; pnpm --version; gh --version

      - name: JavaScript packages
        run: pnpm install --frozen-lockfile

      - name: The CLI and both Macs' Node
        run: |
          pnpm build
          pnpm --filter @grenier/desktop sidecar --target universal-apple-darwin

      - name: Build the universal app, unsigned
        run: |
          pnpm --filter @grenier/desktop tauri build --target universal-apple-darwin --bundles app --no-sign -- --locked
          APP="$PWD/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Grenier.app"
          [ -d "$APP" ] || { echo "no app at $APP" >&2; exit 1; }
          found=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$found" = "$VERSION" ] || { echo "the app says $found, expected $VERSION" >&2; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$WORK/signing.keychain-db"
          PASS=$(openssl rand -hex 16)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$WORK/certificate.p12"
          security import "$WORK/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$WORK/certificate.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign inside out
        run: apps/desktop/scripts/sign-macos.sh "$APP" "${{ secrets.APPLE_SIGNING_IDENTITY }}" "$KEYCHAIN"

      # The signed Node, under the hardened runtime, loads the signed SQLite addon as the app's daemon does.
      - name: The signed daemon runs
        run: |
          run() { GRENIER_HOME="$(mktemp -d "$WORK/home.XXXXXX")" "$@" "$APP/Contents/MacOS/grenier-node" "$APP/Contents/Resources/grenier/dist/grenier.js" today; }
          run
          if arch -x86_64 /usr/bin/true 2> /dev/null; then run arch -x86_64; else echo "No Rosetta: Intel's half not run."; fi
          ln -sf "$APP/Contents/Resources/grenier/bin/grenier" "$WORK/grenier"
          GRENIER_HOME="$(mktemp -d "$WORK/home.XXXXXX")" "$WORK/grenier" today

      - name: DMG, notarized and stapled when NOTARIZE is on
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          # A repository variable, off until Apple's new developer agreement is accepted.
          NOTARIZE: ${{ vars.NOTARIZE }}
        run: |
          STAGE="$WORK/dmg"
          mkdir -p "$STAGE" && cp -R "$APP" "$STAGE/" && ln -s /Applications "$STAGE/Applications"
          DMG="$WORK/Grenier-$VERSION.dmg"
          hdiutil create -volname Grenier -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --keychain "$KEYCHAIN" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          if [ "$NOTARIZE" != true ]; then
            echo "Not notarized: NOTARIZE isn't true."
            exit 0
          fi
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$WORK/AuthKey.p8"
          xcrun notarytool submit "$DMG" --key "$WORK/AuthKey.p8" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
          rm "$WORK/AuthKey.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      # Packed without macOS's ._ files, which Tauri's updater would unpack over the app.
      - name: Update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          UPDATE="$WORK/Grenier_${VERSION}_universal.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$UPDATE" -C "$(dirname "$APP")" "$(basename "$APP")"
          pnpm --filter @grenier/desktop tauri signer sign --app-version "$VERSION" "$UPDATE"
          [ -s "$UPDATE.sig" ] || { echo "no signature beside $UPDATE" >&2; exit 1; }
          # A copy signed with a key other than the one it carries never updates.
          key_id() { base64 -d | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | xxd -p; }
          signed=$(key_id < "$UPDATE.sig")
          trusted=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey' | key_id)
          [ "$signed" = "$trusted" ] || { echo "signed with key $signed, but the app trusts $trusted" >&2; exit 1; }
          echo "UPDATE=$UPDATE" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "v$VERSION" "$DMG" "$UPDATE" "$UPDATE.sig" --clobber --repo "$RELEASES_REPOSITORY"

      - name: Remove the signing keychain and the work folder
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          [ -n "${WORK:-}" ] && rm -rf "$WORK" || true

  linux:
    needs: prepare
    runs-on: home-linux
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # flock: apt's own lock on the shared cache fails at once instead of waiting.
      - name: Linux packages and gh
        run: |
          # archive.ubuntu.com crawls from the home server and security.ubuntu.com doesn't answer: Ubuntu's French mirror.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo mkdir -p /cache/apt/archives/partial
          sudo apt-get update
          sudo flock /cache/apt/lock apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives=/cache/apt/archives \
            build-essential pkg-config file curl wget \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils libarchive-tools
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      # The image has no rustup; `rustup install` with no toolchain named installs rust-toolchain.toml's.
      - name: Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup install --no-self-update
          cargo --version

      - uses: https://github.com/pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # The last release's bundles go first, or they'd be attached again.
      - name: Caches
        run: |
          target=/cache/target/grenier/linux
          rm -rf "$target/release/bundle"
          {
            echo "CARGO_HOME=/cache/cargo"
            echo "CARGO_TARGET_DIR=$target"
            echo "npm_config_store_dir=/cache/pnpm-store"
          } >> "$GITHUB_ENV"

      - name: JavaScript packages
        run: pnpm install --frozen-lockfile

      - name: The CLI and Linux's Node
        run: |
          pnpm build
          pnpm --filter @grenier/desktop sidecar --target x86_64-unknown-linux-gnu

      # Not tauri-action: the runner gives JavaScript actions git.laibe.cc's GITHUB_TOKEN, which GitHub refuses.
      - name: Build the deb, rpm and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy is an AppImage itself, and the job container has no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          pnpm --filter @grenier/desktop tauri build --bundles deb,rpm,appimage \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: The bundled daemon runs
        run: |
          shopt -s nullglob
          debs=("$CARGO_TARGET_DIR"/release/bundle/deb/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "no single deb: ${debs[*]}" >&2; exit 1; }
          root="$RUNNER_TEMP/deb"
          dpkg-deb -x "${debs[0]}" "$root"
          node=$(find "$root" -type f -name grenier-node | head -1)
          script=$(find "$root" -type f -path '*/grenier/dist/grenier.js' | head -1)
          [ -n "$node" ] && [ -n "$script" ] || { echo "the deb has no grenier-node or grenier.js" >&2; exit 1; }
          GRENIER_HOME="$(mktemp -d)" "$node" "$script" today
          rpms=("$CARGO_TARGET_DIR"/release/bundle/rpm/*.rpm)
          [ ${#rpms[@]} -eq 1 ] || { echo "no single rpm: ${rpms[*]}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/rpm"
          bsdtar -xf "${rpms[0]}" -C "$RUNNER_TEMP/rpm"
          for package in deb rpm; do
            command="$RUNNER_TEMP/$package/usr/bin/grenier"
            [ -x "$command" ] || { echo "the $package has no executable /usr/bin/grenier" >&2; exit 1; }
            GRENIER_HOME="$(mktemp -d)" "$command" today
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          shopt -s nullglob
          bundle=$CARGO_TARGET_DIR/release/bundle
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage)
          [ ${#files[@]} -eq 3 ] || { echo "the deb, rpm and AppImage weren't all built: ${files[*]}" >&2; exit 1; }
          for file in "${files[@]}"; do
            [ -f "$file.sig" ] || { echo "$file has no update signature" >&2; exit 1; }
          done
          gh release upload "v$VERSION" "${files[@]}" "${files[@]/%/.sig}" --clobber --repo "$RELEASES_REPOSITORY"

  windows:
    needs: prepare
    runs-on: home-linux
    # Tauri's installer script needs NSIS 3.09 (Win\RestartManager.nsh); Ubuntu 22.04 has 3.08.
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:7bf3a8afc2bbfe7fdaf4b9d2716cb2f3634fd21e4f38e26aa17a12cfda80d721
    timeout-minutes: 90
    # The upload uses bash's arrays; a container job's steps run under sh otherwise.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # unzip opens Node's Windows build, which GNU tar can't.
      # flock: apt's own lock on the shared cache fails at once instead of waiting.
      - name: NSIS, LLVM, unzip and gh
        run: |
          # archive.ubuntu.com crawls from the home server and security.ubuntu.com doesn't answer: Ubuntu's French mirror.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo mkdir -p /cache/apt/archives/partial
          sudo apt-get update
          # tauri-cli wants Linux's tray library even for a Windows build: the Mac's menu bar turns on tray-icon.
          sudo flock /cache/apt/lock apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives=/cache/apt/archives \
            nsis lld llvm clang pkg-config unzip libayatana-appindicator3-dev
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      # The image has no rustup; `rustup install` with no toolchain named installs rust-toolchain.toml's.
      - name: Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup install --no-self-update
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-xwin@0.23.1

      - uses: https://github.com/pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # The last release's installer goes first, or it'd be attached again.
      - name: Caches
        run: |
          target=/cache/target/grenier/windows
          rm -rf "$target/x86_64-pc-windows-msvc/release/bundle" "$target/x86_64-pc-windows-msvc/release/nsis"
          {
            echo "CARGO_HOME=/cache/cargo"
            echo "CARGO_TARGET_DIR=$target"
            echo "npm_config_store_dir=/cache/pnpm-store"
            echo "XWIN_CACHE_DIR=/cache/xwin/grenier"
          } >> "$GITHUB_ENV"

      - name: JavaScript packages
        run: pnpm install --frozen-lockfile

      - name: The CLI and Windows' Node
        run: |
          pnpm build
          pnpm --filter @grenier/desktop sidecar --target x86_64-pc-windows-msvc

      # XWIN_ARCH: Microsoft's CRT and SDK for x64 alone are 630 MB, against 1.1 GB with arm64.
      - name: Cross-build the NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XWIN_ARCH: x86_64
        run: |
          pnpm --filter @grenier/desktop tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
          nsi=$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/nsis/x64/installer.nsi
          grep -q 'cli-path\.nsh' "$nsi" || { echo "the installer has no PATH hook" >&2; exit 1; }
          grep -qE 'oname=bin[\\/]+grenier\.cmd' "$nsi" || { echo "the installer has no bin\\grenier.cmd" >&2; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          shopt -s nullglob
          files=("$CARGO_TARGET_DIR"/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          [ ${#files[@]} -eq 1 ] || { echo "no single installer was built: ${files[*]}" >&2; exit 1; }
          [ -f "${files[0]}.sig" ] || { echo "${files[0]} has no update signature" >&2; exit 1; }
          gh release upload "v$VERSION" "${files[0]}" "${files[0]}.sig" --clobber --repo "$RELEASES_REPOSITORY"

  publish:
    needs: [prepare, macos, linux, windows]
    runs-on: home-linux
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: repos/alaibe/grenier/releases/${{ needs.prepare.outputs.release_id }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: gh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      - name: The release's files
        run: |
          mkdir files && cd files
          gh api "$RELEASE/assets" --paginate \
            --jq '.[] | select(.name | test("\\.json$|^SHA256SUMS$") | not) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$RELEASES_REPOSITORY/releases/assets/$id" > "$name"
            done
          ls -l
          [ "$(find . -maxdepth 1 -type f ! -name '*.sig' | wc -l)" -eq 6 ] ||
            { echo "expected the DMG, the Mac's update bundle, deb, rpm, AppImage and installer" >&2; exit 1; }
          [ "$(find . -maxdepth 1 -type f -name '*.sig' | wc -l)" -eq 5 ] ||
            { echo "expected an update signature beside each of the five update files" >&2; exit 1; }

      - name: SHA256SUMS
        working-directory: files
        run: |
          find . -maxdepth 1 -type f ! -name '*.sig' -printf '%f\n' | sort | xargs sha256sum -- > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"

      # FEED: each updater key, an installer's own before the bare one, and its file ({v} is the version).
      - name: latest.json
        working-directory: files
        env:
          FEED: |
            windows-x86_64 Grenier_{v}_x64-setup.exe
            windows-x86_64-nsis Grenier_{v}_x64-setup.exe
            linux-x86_64 Grenier_{v}_amd64.AppImage
            linux-x86_64-appimage Grenier_{v}_amd64.AppImage
            linux-x86_64-deb Grenier_{v}_amd64.deb
            linux-x86_64-rpm Grenier-{v}-1.x86_64.rpm
            darwin-aarch64 Grenier_{v}_universal.app.tar.gz
            darwin-x86_64 Grenier_{v}_universal.app.tar.gz
            darwin-universal Grenier_{v}_universal.app.tar.gz
            darwin-aarch64-app Grenier_{v}_universal.app.tar.gz
            darwin-x86_64-app Grenier_{v}_universal.app.tar.gz
            darwin-universal-app Grenier_{v}_universal.app.tar.gz
        run: |
          BASE="https://github.com/$RELEASES_REPOSITORY/releases/download/v$VERSION"
          platforms='{}'
          while read -r key name; do
            [ -n "$key" ] || continue
            file="${name//\{v\}/$VERSION}"
            [ -f "$file" ] && [ -f "$file.sig" ] || { echo "$file or its signature is missing" >&2; exit 1; }
            platforms=$(jq --arg key "$key" --arg url "$BASE/$file" --rawfile signature "$file.sig" \
              '. + {($key): {signature: $signature, url: $url}}' <<< "$platforms")
          done <<< "$FEED"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --argjson platforms "$platforms" \
            '{version: $version, notes: "", pub_date: $date, platforms: $platforms}' > "$RUNNER_TEMP/latest.json"
          jq '.platforms | map_values(.url)' "$RUNNER_TEMP/latest.json"

      - name: Attach them
        run: gh release upload "v$VERSION" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/latest.json" --clobber --repo "$RELEASES_REPOSITORY"

      # Only a tag's run publishes; a run by hand leaves its draft for a look.
      - name: Leave draft
        if: startsWith(github.ref, 'refs/tags/')
        run: gh api -X PATCH "$RELEASE" -F draft=false --silent

  homebrew:
    needs: [prepare, publish]
    # The cask follows only a published release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: home-linux
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # Written whole: a change made in the tap alone is lost at the next release.
      - name: Move the cask to this release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1
          V="${{ needs.prepare.outputs.version }}"
          DMG="Grenier-$V.dmg"
          curl -fsSL -o "$DMG" "https://github.com/$RELEASES_REPOSITORY/releases/download/v$V/$DMG"
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          gh repo clone alaibe/homebrew-tap tap -- --depth 1
          cat > tap/Casks/grenier.rb <<EOF
          cask "grenier" do
            version "$V"
            sha256 "$SHA"

            url "https://github.com/alaibe/grenier/releases/download/v#{version}/Grenier-#{version}.dmg"
            name "Grenier"
            desc "Caches what coding agents learn and controls their spend"
            homepage "https://grenier.laibe.cc/"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on :macos

            app "Grenier.app"
            binary "#{appdir}/Grenier.app/Contents/Resources/grenier/bin/grenier"

            zap trash: [
              "~/Library/Application Support/cc.laibe.grenier",
              "~/Library/Caches/cc.laibe.grenier",
              "~/Library/WebKit/cc.laibe.grenier",
            ]
          end
          EOF
          cat tap/Casks/grenier.rb
          gh auth setup-git
          git -C tap add Casks/grenier.rb
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "grenier $V"
          git -C tap push
