name: Nightly release

on:
  schedule:
    # Forgejo reads a bare cron as UTC.
    - cron: 'TZ=Europe/Paris 30 5 * * *'
  workflow_dispatch:

# One run at a time, never cancelled: a cancelled one could stop between its version commit and its tag.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # A tag pushed with the job's own token starts no workflow; one pushed over SSH starts release.yml.
  ORIGIN: ssh://git@git.laibe.cc:2222/anthony/grenier.git

jobs:
  due:
    runs-on: home-linux
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      # main as it is now: a scheduled run's own commit can be an older one, and its version commit would not push.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - id: due
        name: Commits since the last release
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "No release yet: the first is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count "$LAST..HEAD")
          # Commits that only touch the workflows, tests, benchmarks or the markdown make no release.
          APP=$(git rev-list --count "$LAST..HEAD" -- . ':(exclude).forgejo' ':(exclude)tests' \
            ':(exclude)bench' ':(exclude,glob)*.md')
          echo "$COUNT commits since $LAST, $APP of them changing the app"
          [ "$APP" -eq 0 ] || echo "due=true" >> "$GITHUB_OUTPUT"

  tag:
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: mac
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      # `rustup install` with no toolchain named installs rust-toolchain.toml's.
      - name: Rust
        run: |
          rustup install --no-self-update
          cargo --version

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: JavaScript packages
        run: pnpm install --frozen-lockfile

      # tauri-build needs the web UI and the sidecar in place before the shell compiles.
      - name: Desktop UI and sidecar
        run: |
          pnpm build
          pnpm --filter @grenier/desktop build
          pnpm --filter @grenier/desktop sidecar

      # Here too, because nothing checks that CI passed on the commit this tags.
      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: |
          pnpm test
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Version, commit and tag
        run: |
          [ -z "$(git status --porcelain)" ] || { git status --short; echo "the checkout isn't clean" >&2; exit 1; }
          V=$(node scripts/version.ts check)
          if git rev-parse -q --verify "refs/tags/v$V" > /dev/null; then
            V=$(node scripts/version.ts bump)
            git diff --stat
            git -c user.name="Grenier nightly" -c user.email="nightly@git.laibe.cc" commit -q -am "Grenier $V"
            git push "$ORIGIN" HEAD:main
          fi
          git tag "v$V"
          git push "$ORIGIN" "v$V"
          echo "Tagged v$V: release.yml builds it."
