name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SHELLCHECK_VERSION: 0.11.0
  SHFMT_VERSION: 3.14.1

jobs:
  check:
    # The nightly has just run Types and Tests on its own version commit.
    if: ${{ github.event.head_commit.author.email != 'nightly@git.laibe.cc' }}
    runs-on: home-linux
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux packages
        run: |
          # archive and security.ubuntu.com crawl from the home server; the French mirror carries both.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo mkdir -p /cache/apt/archives/partial
          sudo flock /cache/apt/lock apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives=/cache/apt/archives \
            build-essential pkg-config file curl wget \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

      # The image has no rustup; rust-toolchain.toml picks the toolchain.
      - name: Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      - name: Tools
        uses: https://github.com/taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }},shfmt@${{ env.SHFMT_VERSION }}

      - uses: https://github.com/pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # After the installers, which keep rustup's and the tools' binaries in the job's own ~/.cargo.
      - name: Caches
        run: |
          {
            echo "CARGO_HOME=/cache/cargo"
            echo "CARGO_TARGET_DIR=/cache/target/grenier/check"
            echo "npm_config_store_dir=/cache/pnpm-store"
          } >> "$GITHUB_ENV"

      - name: JavaScript packages
        run: pnpm install --frozen-lockfile

      # tauri-build needs the web UI and the sidecar in place before the shell compiles.
      - name: Desktop UI and sidecar
        run: |
          pnpm build
          pnpm --filter @grenier/desktop build
          pnpm --filter @grenier/desktop sidecar

      - name: Shell scripts
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ] && head -c 40 "$file" | grep -qE '^#!.*(bash|/sh)'; then printf '%s\0' "$file"; fi
          done > "$RUNNER_TEMP/shell"
          tr '\0' '\n' < "$RUNNER_TEMP/shell"

      - name: Format
        run: |
          pnpm format:check
          xargs -0 -r shfmt -d -i 4 -ci -bn < "$RUNNER_TEMP/shell"

      - name: Lint
        run: |
          pnpm lint
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          xargs -0 -r shellcheck -S warning < "$RUNNER_TEMP/shell"
          xargs -0 -r -n 1 bash -n < "$RUNNER_TEMP/shell"
          pnpm audit --audit-level moderate
          node scripts/version.ts check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: |
          pnpm test
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: E2e
        run: pnpm test:e2e
